name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  rubocop:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
      - name: Checkout with push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: ruby
          bundler-cache: false
      - name: Setup Takumi Guard for RubyGems
        uses: flatt-security/setup-takumi-guard-rubygems@3b2c3f30e03dd0beb678139fd7400cb93420e03f # v1
      - name: Bundle install
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: ruby
          bundler-cache: true
          cache-version: 2
      - name: Install dependencies
        run: bundle install
      - name: Run rubocop
        run: bundle exec rubocop
